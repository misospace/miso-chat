name: Build Android Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (stable/beta/internal)'
        required: true
        default: 'internal'
        type: choice
        options:
          - stable
          - beta
          - internal

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHANNEL: ${{ github.event.inputs.channel || 'stable' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout release tag (release events only)
        if: github.event_name == 'release'
        run: |
          git fetch --tags
          git checkout ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      # ---- Inject release signing material ----
      # Decodes the base64-encoded keystore (ANDROID_KEYSTORE_BASE64) and
      # writes android/key.properties consumed by app/build.gradle. Without
      # these secrets the release build type fails fast with a clear error —
      # see RELEASE.md#android-release-signing.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing one of ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD; refusing to build an unsigned release APK." >&2
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # ---- Release build (signed) ----
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      # ---- Package OTA web bundle ----
      - name: Package OTA web bundle
        run: |
          cd public
          zip -r ../dist.zip .

      # ---- Version info ----
      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version_tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version_tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      # ---- Rename artifacts for clarity in release assets ----
      - name: Rename release artifacts
        if: github.event_name == 'release'
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          if [ -z "$APK_FILE" ]; then echo "::error::No APK found in build output"; exit 1; fi
          if [ -z "$AAB_FILE" ]; then echo "::error::No AAB found in build output"; exit 1; fi
          cp "$APK_FILE" "miso-chat-${{ steps.version.outputs.version }}-release.apk"
          cp "$AAB_FILE" "miso-chat-${{ steps.version.outputs.version }}.aab"

      # ---- Generate SHA-256 digests for OTA integrity (after rename) ----
      - name: Compute artifact digests
        id: digests
        run: |
          APK_PATH="miso-chat-${{ steps.version.outputs.version }}-release.apk"
          AAB_PATH="miso-chat-${{ steps.version.outputs.version }}.aab"
          if [ ! -f "$APK_PATH" ]; then echo "::error::Renamed APK not found: $APK_PATH"; exit 1; fi
          if [ ! -f "$AAB_PATH" ]; then echo "::error::Renamed AAB not found: $AAB_PATH"; exit 1; fi
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          AAB_SHA256=$(sha256sum "$AAB_PATH" | awk '{print $1}')
          DIST_SHA256=$(sha256sum dist.zip | awk '{print $1}')
          if [ -z "$APK_SHA256" ]; then echo "::error::APK SHA-256 digest is empty"; exit 1; fi
          echo "apk_sha256=${APK_SHA256}" >> $GITHUB_OUTPUT
          echo "aab_sha256=${AAB_SHA256}" >> $GITHUB_OUTPUT
          echo "dist_sha256=${DIST_SHA256}" >> $GITHUB_OUTPUT

      # ---- Generate Update Manifest (release events only) ----
      - name: Generate Update Manifest
        if: github.event_name == 'release'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.version_tag }}"
          APK_SHA256="${{ steps.digests.apk_sha256 }}"
          AAB_SHA256="${{ steps.digests.aab_sha256 }}"
          DIST_SHA256="${{ steps.digests.dist_sha256 }}"

          # Fail fast if digest is empty
          if [ -z "$APK_SHA256" ]; then echo "::error::APK digest is empty — aborting manifest generation"; exit 1; fi

          APK_FILE="miso-chat-${VERSION}-release.apk"
          AAB_FILE="miso-chat-${VERSION}.aab"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          cat > update-manifest.json << EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "releaseDate": "${{ github.event.release.created_at }}",
            "releaseNotes": "${{ github.event.release.body }}",
            "digestAlgorithm": "sha-256",
            "channels": {
              "stable": {
                "version": "${VERSION}",
                "bundleUrl": "${BASE_URL}/dist.zip",
                "apkUrl": "${BASE_URL}/${APK_FILE}",
                "aabUrl": "${BASE_URL}/${AAB_FILE}",
                "digest": "${APK_SHA256}",
                "mandatory": false
              },
              "beta": {
                "version": "${VERSION}",
                "bundleUrl": "${BASE_URL}/dist.zip",
                "apkUrl": "${BASE_URL}/${APK_FILE}",
                "aabUrl": "${BASE_URL}/${AAB_FILE}",
                "digest": "${APK_SHA256}",
                "mandatory": false
              }
            }
          }
          EOF
          cat update-manifest.json

      # ---- Generate Update Manifest (workflow_dispatch — internal channel) ----
      - name: Generate Internal Manifest
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'internal'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.version_tag }}"
          APK_SHA256="${{ steps.digests.apk_sha256 }}"

          if [ -z "$APK_SHA256" ]; then echo "::error::APK digest is empty — aborting manifest generation"; exit 1; fi

          APK_FILE="miso-chat-${VERSION}-release.apk"
          AAB_FILE="miso-chat-${VERSION}.aab"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          cat > update-manifest.json << EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "channel": "internal",
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "digestAlgorithm": "sha-256",
            "channels": {
              "internal": {
                "version": "${VERSION}",
                "bundleUrl": "${BASE_URL}/dist.zip",
                "apkUrl": "${BASE_URL}/${APK_FILE}",
                "aabUrl": "${BASE_URL}/${AAB_FILE}",
                "digest": "${APK_SHA256}",
                "mandatory": false,
                "notes": "Internal build from workflow dispatch — not for production use."
              }
            }
          }
          EOF
          cat update-manifest.json

      # ---- Upload release artifacts to GitHub Release ----
      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            miso-chat-${{ steps.version.outputs.version }}-release.apk
            miso-chat-${{ steps.version.outputs.version }}.aab
            dist.zip
            update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Verify release assets were uploaded ----
      - name: Verify release assets
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.version_tag }}
        run: ./scripts/check-release-assets.sh "${{ steps.version.outputs.version_tag }}"

      # ---- Upload OTA Bundle Artifact (workflow_dispatch only) ----
      - name: Upload OTA Bundle Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ota-web-bundle
          path: dist.zip

      # ---- Upload Release APK Artifact (workflow_dispatch only) ----
      - name: Upload Release APK Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: miso-chat-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      # ---- Upload Release AAB Artifact (workflow_dispatch only) ----
      - name: Upload Release AAB Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: miso-chat-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # ---- Upload Manifest Artifact (workflow_dispatch only) ----
      - name: Upload Manifest Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: update-manifest
          path: update-manifest.json
